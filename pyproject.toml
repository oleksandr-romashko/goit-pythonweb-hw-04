
[project]
name = "goit-pythonweb-hw-04"
version = "0.1.0"
description = "A Python file sorter based on file extensions"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Oleksandr Romashko", email = "alex.rmshk@gmail.com" }
]
requires-python = ">=3.8,<3.12"
dynamic = ["dependencies"]  # suppress poetry dependencies warning

[project.urls]
Homepage = "https://github.com/oleksandr-romashko"


[tool.poetry]
packages = [{ include = "src" }]
package-mode = false

[tool.poetry.dependencies]
aiofiles = ">=24.1.0,<25.0.0"
aioshutil = ">=1.5,<2.0"
tomli = { version = ">=2.2.1", python = "<3.11" }
colorama = ">=0.4.6,<0.5.0"

[tool.poetry.group.dev.dependencies]
types-colorama = "^0.4.15.20240311"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

